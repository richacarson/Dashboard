name = "dashboard-api-proxy"
main = "index.js"
compatibility_date = "2026-01-01"

# Origins permitted to call the proxy. Add localhost entries only while developing.
[vars]
ALLOWED_ORIGINS = "https://richacarson.github.io"

# Secrets are NOT set here — they would end up in git. Set them once with:
#   npx wrangler secret put FMP_KEY
#   npx wrangler secret put ANTHROPIC_KEY
