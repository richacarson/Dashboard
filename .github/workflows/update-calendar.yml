name: Update Calendars

on:
  schedule:
    - cron: '0 5 * * 1-5'    # Midnight ET - refresh schedule
    - cron: '45 12 * * 1-5'  # 8:45 AM ET - catch 8:30 releases (CPI, PPI, NFP, GDP, claims)
    - cron: '15 13 * * 1-5'  # 9:15 AM ET - stragglers from 8:30/9:00
    - cron: '15 14 * * 1-5'  # 10:15 AM ET - catch 10:00 releases (ISM, consumer, home sales)
    - cron: '0 16 * * 1-5'   # 12:00 PM ET - midday catch-all
    - cron: '15 18 * * 1-5'  # 2:15 PM ET - FOMC decisions
    - cron: '0 19 * * 1-5'   # 3:00 PM ET - post-FOMC press conference
    - cron: '0 12 * * 0'     # Sunday noon - get next week's schedule
  workflow_dispatch:

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    env:
      FMP_KEY: ${{ secrets.FMP_API }}
      FINNHUB_KEY: ${{ secrets.FINHUB_API }}
      FRED_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch calendar data
        run: |
          FROM=$(date -u +%Y-%m-%d -d "last monday")
          TO=$(date -u +%Y-%m-%d -d "next sunday + 7 days")

          echo "{}" > /tmp/finnhub_econ.json
          echo "[]" > /tmp/fmp_econ.json

          # Finnhub economic calendar (primary — includes actuals natively)
          if [ -n "$FINNHUB_KEY" ]; then
            HTTP_CODE=$(curl -sL -o /tmp/finnhub_econ.json -w "%{http_code}" \
              "https://finnhub.io/api/v1/calendar/economic?from=${FROM}&to=${TO}&token=${FINNHUB_KEY}" 2>/dev/null || echo "000")
            SIZE=$(wc -c < /tmp/finnhub_econ.json 2>/dev/null || echo "0")
            echo "Finnhub Economic Calendar: HTTP $HTTP_CODE, $SIZE bytes"
          fi

          # FMP economic calendar (secondary — also has actuals)
          if [ -n "$FMP_KEY" ]; then
            HTTP_CODE=$(curl -sL -o /tmp/fmp_econ.json -w "%{http_code}" \
              "https://financialmodelingprep.com/api/v3/economic_calendar?from=${FROM}&to=${TO}&apikey=${FMP_KEY}" 2>/dev/null || echo "000")
            SIZE=$(wc -c < /tmp/fmp_econ.json 2>/dev/null || echo "0")
            echo "FMP Economic Calendar: HTTP $HTTP_CODE, $SIZE bytes"
          fi

      - name: Process and write calendar
        run: |
          python3 << 'PY'
          import json

          events = []

          # PRIMARY: Finnhub economic calendar (includes actuals natively, no name matching needed)
          try:
              with open('/tmp/finnhub_econ.json') as f:
                  data = json.loads(f.read())
              raw = data.get('economicCalendar', data.get('result', []))
              if isinstance(raw, list):
                  for e in raw:
                      if e.get('country') == 'US' and (e.get('impact') or '').lower() in ('high', 'medium'):
                          events.append({
                              'title': e.get('event', ''),
                              'date': e.get('time') or e.get('date', ''),
                              'country': 'USD',
                              'impact': (e.get('impact') or '').capitalize(),
                              'actual': str(e['actual']) if e.get('actual') is not None else '',
                              'previous': str(e['prev']) if e.get('prev') is not None else '',
                              'forecast': str(e['estimate']) if e.get('estimate') is not None else '',
                              'unit': e.get('unit', ''),
                          })
                  print(f"Finnhub: {len(events)} US High/Medium events")
          except Exception as ex:
              print(f"Finnhub econ error: {ex}")

          # SECONDARY: FMP economic calendar (if Finnhub failed)
          if not events:
              try:
                  with open('/tmp/fmp_econ.json') as f:
                      fmp = json.loads(f.read())
                  if isinstance(fmp, list):
                      for e in fmp:
                          if e.get('country') == 'US' and (e.get('impact') or '').lower() in ('high', 'medium'):
                              events.append({
                                  'title': e.get('event', ''),
                                  'date': e.get('date', ''),
                                  'country': 'USD',
                                  'impact': (e.get('impact') or '').capitalize(),
                                  'actual': str(e['actual']) if e.get('actual') is not None else '',
                                  'previous': str(e['previous']) if e.get('previous') is not None else '',
                                  'forecast': str(e['estimate']) if e.get('estimate') is not None else '',
                              })
                      print(f"FMP fallback: {len(events)} events")
              except Exception as ex:
                  print(f"FMP fallback error: {ex}")

          events.sort(key=lambda e: e.get('date', ''))
          with_actuals = [e for e in events if e.get('actual') and str(e['actual']).strip()]
          print(f"Final: {len(events)} events ({len(with_actuals)} with actuals)")

          # Preserve actuals from existing file (in case source temporarily lost them)
          try:
              with open('public/economic-calendar.json') as ef:
                  existing = json.loads(ef.read())
              existing_map = {}
              for e in existing:
                  key = e.get('title', '') + '|' + (e.get('date', '')[:10])
                  if e.get('actual') and str(e['actual']).strip():
                      existing_map[key] = e['actual']
              merged = 0
              for e in events:
                  key = e.get('title', '') + '|' + (e.get('date', '')[:10])
                  if (not e.get('actual') or not str(e['actual']).strip()) and key in existing_map:
                      e['actual'] = existing_map[key]
                      merged += 1
              if merged:
                  print(f"Preserved {merged} actuals from existing file")
          except Exception as ex:
              print(f"Merge skipped: {ex}")

          with open('public/economic-calendar.json', 'w') as f:
              json.dump(events, f, indent=2)
          PY

      - name: Fetch earnings calendar
        run: |
          # Get this week and next week date ranges
          THIS_MON=$(date -u +%Y-%m-%d -d "last monday")
          THIS_FRI=$(date -u +%Y-%m-%d -d "last monday + 4 days")
          NEXT_MON=$(date -u +%Y-%m-%d -d "next monday")
          NEXT_FRI=$(date -u +%Y-%m-%d -d "next monday + 4 days")

          echo "[]" > /tmp/earnings_fmp.json
          echo "[]" > /tmp/earnings_finnhub.json

          # FMP earnings
          if [ -n "$FMP_KEY" ]; then
            HTTP_CODE=$(curl -sL -o /tmp/earnings_fmp_raw.json -w "%{http_code}" \
              "https://financialmodelingprep.com/api/v3/earning_calendar?from=${THIS_MON}&to=${NEXT_FRI}&apikey=${FMP_KEY}" 2>/dev/null || echo "000")
            SIZE=$(wc -c < /tmp/earnings_fmp_raw.json 2>/dev/null || echo "0")
            echo "FMP Earnings: HTTP $HTTP_CODE, $SIZE bytes"
            if [ "$HTTP_CODE" = "200" ] && [ "$SIZE" -gt 10 ]; then
              cp /tmp/earnings_fmp_raw.json /tmp/earnings_fmp.json
            fi
          fi

          # Finnhub earnings
          if [ -n "$FINNHUB_KEY" ]; then
            HTTP_CODE=$(curl -sL -o /tmp/earnings_finnhub_raw.json -w "%{http_code}" \
              "https://finnhub.io/api/v1/calendar/earnings?from=${THIS_MON}&to=${NEXT_FRI}&token=${FINNHUB_KEY}" 2>/dev/null || echo "000")
            SIZE=$(wc -c < /tmp/earnings_finnhub_raw.json 2>/dev/null || echo "0")
            echo "Finnhub Earnings: HTTP $HTTP_CODE, $SIZE bytes"
            if [ "$HTTP_CODE" = "200" ] && [ "$SIZE" -gt 10 ]; then
              cp /tmp/earnings_finnhub_raw.json /tmp/earnings_finnhub.json
            fi
          fi

      - name: Process earnings calendar
        run: |
          python3 << 'PY'
          import json

          earnings = {}  # key: symbol|date

          # Portfolio holdings — always include from Finnhub even when FMP has data
          PORTFOLIO = {
              "ABT","ADI","ATO","ADP","BKH","CAT","CHD","CL","DVN","FAST","GD","GPC","LRCX","LMT","NEE","NTR","ORI","PCAR","QCOM","DGX","SSNC","STLD","SYK","TEL","VLO",
              "AMD","AEM","ATAT","CVX","CWAN","CNX","COIN","CRDO","EIX","FCX","FTNT","SUPV","HRMY","HUT","HOOD","KEYS","MARA","MRVL","NVDA","NXPI","OKE","SYF","TSM","TOL","VST",
              "IBIT","ETHA",
          }

          # FMP is primary (reliable dates)
          try:
              with open('/tmp/earnings_fmp.json') as f:
                  data = json.loads(f.read())
              if isinstance(data, list):
                  for e in data:
                      sym, dt = e.get('symbol'), e.get('date')
                      if not sym or not dt:
                          continue
                      key = f"{sym}|{dt}"
                      earnings[key] = {
                          'symbol': sym, 'date': dt,
                          'hour': 'bmo' if e.get('time') == 'bmo' else ('amc' if e.get('time') == 'amc' else (e.get('time') or '')),
                          'epsEstimate': e.get('epsEstimated'),
                          'epsActual': e.get('eps'),
                          'revenueEstimate': e.get('revenueEstimated'),
                          'revenueActual': e.get('revenue'),
                          'source': 'fmp',
                      }
                  print(f"FMP: {len(earnings)} earnings entries")
          except Exception as ex:
              print(f"FMP earnings error: {ex}")

          # Finnhub overlay
          fmp_count = len(earnings)
          try:
              with open('/tmp/earnings_finnhub.json') as f:
                  data = json.loads(f.read())
              raw = data.get('earningsCalendar', data.get('result', data.get('data', [])))
              if not isinstance(raw, list):
                  raw = raw.get('result', raw.get('data', []))
              added = 0
              for e in (raw if isinstance(raw, list) else []):
                  sym, dt = e.get('symbol'), e.get('date')
                  if not sym or not dt:
                      continue
                  key = f"{sym}|{dt}"
                  if key in earnings:
                      # Fill missing fields
                      ex = earnings[key]
                      if ex.get('epsActual') is None and e.get('epsActual') is not None:
                          ex['epsActual'] = e['epsActual']
                      if ex.get('epsEstimate') is None:
                          ex['epsEstimate'] = e.get('epsEstimate') or e.get('estimate')
                      if ex.get('revenueActual') is None and e.get('revenueActual') is not None:
                          ex['revenueActual'] = e['revenueActual']
                      if not ex.get('hour') and e.get('hour'):
                          ex['hour'] = e['hour']
                  elif fmp_count == 0 or sym in PORTFOLIO:
                      # Add Finnhub-only entries if no FMP OR if it's a portfolio holding
                      earnings[key] = {
                          'symbol': sym, 'date': dt, 'hour': e.get('hour', ''),
                          'epsEstimate': e.get('epsEstimate') or e.get('estimate'),
                          'epsActual': e.get('epsActual'),
                          'revenueEstimate': e.get('revenueEstimate'),
                          'revenueActual': e.get('revenueActual'),
                          'source': 'finnhub',
                      }
                      added += 1
              if added:
                  print(f"Finnhub: added {added} entries (no FMP)")
          except Exception as ex:
              print(f"Finnhub earnings error: {ex}")

          result = sorted(earnings.values(), key=lambda e: (e.get('date', ''), e.get('symbol', '')))
          print(f"Final: {len(result)} earnings entries")

          with open('public/earnings-calendar.json', 'w') as f:
              json.dump(result, f, indent=2)
          PY

      - name: Fetch macro indicators (FRED + FMP)
        run: |
          python3 << 'PYFRED'
          import json, urllib.request, os, sys
          from datetime import datetime, timedelta

          data = {}
          fred = os.environ.get('FRED_KEY', '')
          fmp = os.environ.get('FMP_KEY', '')

          def fetch(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Dashboard/1.0'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f"  WARN: {e}", file=sys.stderr)
                  return None

          # 1. FRED: Initial Claims 4-week avg (IC4WSA is already smoothed)
          if fred:
              d = fetch(f'https://api.stlouisfed.org/fred/series/observations?series_id=IC4WSA&api_key={fred}&sort_order=desc&limit=10&file_type=json')
              if d:
                  obs = [{'date': o['date'], 'val': float(o['value'])} for o in d.get('observations', []) if o['value'] != '.']
                  if len(obs) >= 2:
                      data['claims'] = obs[0]['val']
                      data['claimsDate'] = obs[0]['date']
                      data['claims4wk'] = round(obs[0]['val'])
                      if len(obs) >= 5:
                          data['claimsTrend'] = round((obs[0]['val'] / obs[4]['val'] - 1) * 100, 2)
                      print(f"Claims: {data['claims4wk']} (trend: {data.get('claimsTrend', 'N/A')}%)")

          # 2. FRED: CFNAI
          if fred:
              d = fetch(f'https://api.stlouisfed.org/fred/series/observations?series_id=CFNAI&api_key={fred}&sort_order=desc&limit=4&file_type=json')
              if d:
                  obs = [{'date': o['date'], 'val': float(o['value'])} for o in d.get('observations', []) if o['value'] != '.']
                  if obs:
                      data['cfnai'] = obs[0]['val']
                      data['cfnaiDate'] = obs[0]['date']
                      if len(obs) >= 3:
                          data['cfnai3mo'] = round(sum(o['val'] for o in obs[:3]) / 3, 3)
                      print(f"CFNAI: {data['cfnai']} (3mo: {data.get('cfnai3mo', 'N/A')})")

          # 3. FRED: Unemployment rate (Sahm Rule)
          if fred:
              d = fetch(f'https://api.stlouisfed.org/fred/series/observations?series_id=UNRATE&api_key={fred}&sort_order=desc&limit=13&file_type=json')
              if d:
                  vals = [float(o['value']) for o in d.get('observations', []) if o['value'] != '.']
                  if len(vals) >= 3:
                      avg3 = (vals[0] + vals[1] + vals[2]) / 3
                      low12 = min(vals)
                      data['sahmVal'] = round(avg3 - low12, 2)
                      data['unrate'] = vals[0]
                      data['unrateDate'] = d['observations'][0]['date']
                      print(f"Sahm: {data['sahmVal']}pp (unemployment: {data['unrate']}%)")

          # 3b. FRED: BAA-10Y credit spread (Moody's BAA corporate minus 10Y Treasury)
          if fred:
              d = fetch(f'https://api.stlouisfed.org/fred/series/observations?series_id=BAA10Y&api_key={fred}&sort_order=desc&limit=3&file_type=json')
              if d:
                  obs = [(o['date'], float(o['value'])) for o in d.get('observations', []) if o['value'] != '.']
                  if obs:
                      data['baa10y'] = obs[0][1]
                      data['baa10yDate'] = obs[0][0]
                      print(f"BAA10Y: {data['baa10y']}% ({data['baa10yDate']})")

          # 3c. FRED: NFCI (Chicago Fed National Financial Conditions Index, weekly)
          # 105-component composite. >0 = tighter than average. Brave & Butters (2010).
          if fred:
              d = fetch(f'https://api.stlouisfed.org/fred/series/observations?series_id=NFCI&api_key={fred}&sort_order=desc&limit=3&file_type=json')
              if d:
                  obs = [(o['date'], float(o['value'])) for o in d.get('observations', []) if o['value'] != '.']
                  if obs:
                      data['nfci'] = obs[0][1]
                      data['nfciDate'] = obs[0][0]
                      print(f"NFCI: {data['nfci']} ({data['nfciDate']})")

          # 4. Treasury.gov: Yield curve (free, no key)
          import csv, io
          try:
              now = datetime.now(tz=None)
              url = f'https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/all/{now.strftime("%Y%m")}?type=daily_treasury_yield_curve&field_tdr_date_value={now.year}&page&_format=csv'
              req = urllib.request.Request(url, headers={'User-Agent': 'Dashboard/1.0'})
              with urllib.request.urlopen(req, timeout=15) as r:
                  text = r.read().decode()
              reader = csv.DictReader(io.StringIO(text))
              rows = list(reader)
              if rows:
                  latest = rows[0]
                  y10 = float(latest.get('10 Yr', 0))
                  y2 = float(latest.get('2 Yr', 0))
                  y3m = float(latest.get('3 Mo', 0))
                  data['yield10Y'] = y10
                  data['yield2Y'] = y2
                  data['yield3M'] = y3m
                  data['yieldSpread'] = round(y10 - y2, 3)
                  data['yieldDate'] = latest.get('Date', '')
                  print(f"Yield: 10Y={y10}, 2Y={y2}, spread={data['yieldSpread']}")
          except Exception as e:
              print(f"Treasury.gov yield curve failed: {e}", file=sys.stderr)

          # 5. Yahoo Finance: VIX (free, no key)
          try:
              d = fetch('https://query1.finance.yahoo.com/v8/finance/chart/%5EVIX?range=1d&interval=1d')
              if d and d.get('chart', {}).get('result'):
                  data['vix'] = d['chart']['result'][0]['meta']['regularMarketPrice']
                  print(f"VIX: {data['vix']}")
          except Exception as e:
              print(f"Yahoo VIX failed: {e}", file=sys.stderr)

          # 6. Yahoo Finance: SPY PE ratio
          try:
              d = fetch('https://query1.finance.yahoo.com/v8/finance/chart/SPY?range=1d&interval=1d')
              if d and d.get('chart', {}).get('result'):
                  meta = d['chart']['result'][0]['meta']
                  data['spyPrice'] = meta.get('regularMarketPrice')
              # Get PE from quote summary
              d2 = fetch('https://query1.finance.yahoo.com/v10/finance/quoteSummary/SPY?modules=defaultKeyStatistics')
              if d2 and d2.get('quoteSummary', {}).get('result'):
                  stats = d2['quoteSummary']['result'][0].get('defaultKeyStatistics', {})
                  pe_val = stats.get('trailingPE', {})
                  if isinstance(pe_val, dict):
                      data['spyPE'] = pe_val.get('raw') or pe_val.get('fmt')
                  elif pe_val:
                      data['spyPE'] = float(pe_val)
                  print(f"SPY PE: {data.get('spyPE')}")
          except Exception as e:
              print(f"Yahoo SPY failed: {e}", file=sys.stderr)

          # 7. Yahoo Finance: Crude Oil (WTI) and Gold futures
          for sym, key in [('CL=F', 'oil'), ('GC=F', 'gold')]:
              try:
                  d = fetch(f'https://query1.finance.yahoo.com/v8/finance/chart/{sym}?range=1d&interval=1d')
                  if d and d.get('chart', {}).get('result'):
                      meta = d['chart']['result'][0]['meta']
                      data[f'{key}Price'] = meta.get('regularMarketPrice')
                      pc = meta.get('chartPreviousClose')
                      if data[f'{key}Price'] and pc:
                          data[f'{key}Chg'] = round((data[f'{key}Price'] / pc - 1) * 100, 2)
                      print(f"{key.upper()}: ${data[f'{key}Price']} ({data.get(f'{key}Chg', '?')}%)")
              except Exception as e:
                  print(f"Yahoo {key} failed: {e}", file=sys.stderr)

          # 8. Yahoo Finance: Oil YoY % change (WTI 1-year history)
          # Oil shocks transmit to earnings on a 3-4 quarter lag (Hamilton 1983, 2003; Kilian 2009).
          # Every post-WWII US recession except 2020 was preceded by a significant oil price spike.
          try:
              d = fetch('https://query1.finance.yahoo.com/v8/finance/chart/CL=F?range=1y&interval=1d')
              if d and d.get('chart', {}).get('result'):
                  res = d['chart']['result'][0]
                  closes = res.get('indicators', {}).get('quote', [{}])[0].get('close', [])
                  closes = [c for c in closes if c is not None]
                  if len(closes) >= 200 and data.get('oilPrice'):
                      yearAgo = closes[0]
                      if yearAgo and yearAgo > 0:
                          data['oilYoY'] = round((data['oilPrice'] / yearAgo - 1) * 100, 2)
                          print(f"Oil YoY: {data['oilYoY']}% (year ago: ${yearAgo:.2f})")
          except Exception as e:
              print(f"Oil YoY failed: {e}", file=sys.stderr)

          # 9. SPY trailing EPS — derived from existing spyPrice / spyPE
          # Yahoo's quoteSummary endpoint is now gated (401), so we back into trailing EPS
          # from the price and P/E we already fetch. Tracks rolling history so we can
          # compute the trend — falling trailing EPS = earnings recession in progress.
          if data.get('spyPrice') and data.get('spyPE'):
              try:
                  data['spyEpsTtm'] = round(float(data['spyPrice']) / float(data['spyPE']), 2)
                  print(f"SPY trailing EPS (derived): ${data['spyEpsTtm']}")
              except Exception as e:
                  print(f"SPY EPS derivation failed: {e}", file=sys.stderr)

          # 10. Maintain rolling history of trailing EPS to compute 90-day trend
          # Only append once per day (workflow runs 7x/day)
          if data.get('spyEpsTtm'):
              try:
                  with open('public/macro-data.json') as f:
                      existing = json.loads(f.read())
                  hist = existing.get('spyEpsTtmHist') or existing.get('spyEpsFwdHist') or []
              except:
                  hist = []
              today = datetime.utcnow().strftime('%Y-%m-%d')
              if not hist or hist[-1].get('date') != today:
                  hist.append({'date': today, 'val': data['spyEpsTtm']})
              else:
                  hist[-1]['val'] = data['spyEpsTtm']
              # Trim to last 120 entries (~4 months of daily data)
              hist = hist[-120:]
              data['spyEpsTtmHist'] = hist
              # Compute 90-day % change if we have enough history
              if len(hist) >= 60:
                  oldVal = hist[0]['val']
                  if oldVal and oldVal > 0:
                      data['epsChg90d'] = round((data['spyEpsTtm'] / oldVal - 1) * 100, 2)
                      print(f"EPS 90d trend: {data['epsChg90d']}% over {len(hist)} days")

          data['updated'] = datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')

          # Merge with existing data (preserve fields that didn't update)
          try:
              with open('public/macro-data.json') as f:
                  existing = json.loads(f.read())
              for k, v in existing.items():
                  if k not in data and k != 'updated':
                      data[k] = v
          except:
              pass

          with open('public/macro-data.json', 'w') as f:
              json.dump(data, f, indent=2)
          print(f"Wrote macro-data.json with {len(data)} fields")
          PYFRED

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/economic-calendar.json public/earnings-calendar.json public/macro-data.json
          git diff --cached --quiet || (git commit -m "Auto-update calendars $(date -u +%Y-%m-%d\ %H:%M) UTC" && git push)
