name: Performance Attribution

# Deterministic compute of Carson's stewardship record into public/performance.json.
# Pure file math — reads only committed files (portfolio-history-*.json + risk-data-drop.json),
# no secrets, no LLM. The Chief of Staff reads the result and narrates it.

on:
  schedule:
    - cron: '30 11 * * 1-5'   # 6:30 AM CT weekdays — after the 6:17 risk drop, before the 7:15 CoS
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Portfolio History"]   # also refresh right after history rebuilds
    types: [completed]

permissions:
  contents: write

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute attribution
        run: python3 scripts/performance-attribution.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/performance.json
          git diff --cached --quiet || (git commit -m "Performance attribution $(date -u +%Y-%m-%d\ %H:%M) UTC" && git push)
