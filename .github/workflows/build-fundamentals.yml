name: Build Fundamentals

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 03:00 UTC — fundamentals only change on earnings
    - cron: '0 3 * * 0'
  push:
    branches: [main]
    paths:
      - 'scripts/build-fundamentals.py'
      - 'scripts/build-fundamentals-fmp.py'
      - 'scripts/build-portfolio-fundamentals.py'

permissions:
  contents: write

jobs:
  build-fundamentals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build fundamentals JSON (FMP)
        env:
          # Routed through the Cloudflare Worker, which attaches the FMP key
          # server-side — so no FMP secret is needed here at all. Set FMP_KEY
          # instead if you ever want to bypass the Worker.
          FMP_PROXY: ${{ secrets.PROXY_URL }}
        run: python3 scripts/build-fundamentals-fmp.py
      - name: Build portfolio-blended + benchmark fundamentals
        env:
          FMP_PROXY: ${{ secrets.PROXY_URL }}
        run: python3 scripts/build-portfolio-fundamentals.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/fundamentals/ public/portfolio-fundamentals-*.json public/benchmark-fundamentals.json
          git commit -m "Update fundamentals data" || echo "No changes"
          git pull --rebase origin main
          git push
