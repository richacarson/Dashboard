name: Build Fundamentals

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 03:00 UTC — fundamentals only change on earnings
    - cron: '0 3 * * 0'
  push:
    branches: [main]
    paths:
      - 'scripts/build-fundamentals.py'

permissions:
  contents: write

jobs:
  build-fundamentals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build fundamentals JSON
        run: python3 scripts/build-fundamentals.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/fundamentals/
          git commit -m "Update fundamentals data" || echo "No changes"
          git pull --rebase origin main
          git push
