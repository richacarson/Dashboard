name: Backtest bear-probability model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/backtest-bear-model.py"
      - ".github/workflows/backtest-bear-model.yml"
  schedule:
    # Weekly: Sunday 1pm UTC (after week ends)
    - cron: "0 13 * * 0"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run backtest
        env:
          FRED_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python3 scripts/backtest-bear-model.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/model-backtest.json
          git diff --staged --quiet || git commit -m "Auto-update backtest results $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
